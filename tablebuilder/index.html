<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Builder — publication tables from CSV</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@300;400;700&family=Roboto:wght@300;400;700&family=Roboto+Condensed:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64">

  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/table-preview.css">
</head>
<body>

<div class="app">

  <!-- ============ Top bar ============ -->
  <header class="topbar">
    <div class="topbar-brand">
      <svg class="brand-mark" viewBox="0 0 16 16" fill="currentColor" role="img" aria-label="Table Builder">
        <path d="M1 1H15V15H1Z M2 5V9H7V5Z M8 5V9H14V5Z M2 10V14H7V10Z M8 10V14H14V10Z"/>
      </svg>
      <span class="brand-name">Table Builder</span>
      <span class="brand-file" id="file-label">no data</span>
    </div>

    <div class="topbar-actions">
      <button class="btn" id="btn-new" title="Clear everything and start again">New project</button>
      <button class="btn" id="btn-paste" title="Paste a table from a spreadsheet or a web page">Paste table</button>
      <span class="topbar-sep"></span>
      <button class="btn btn-icon" id="btn-undo" title="Undo (Ctrl+Z)" disabled>↶</button>
      <button class="btn btn-icon" id="btn-redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
      <button class="btn btn-icon" id="btn-history" title="Everything done since the data was loaded"
              aria-expanded="false" disabled>▾</button>
      <span class="topbar-sep"></span>
      <button class="btn" id="btn-open-spec" title="Open a saved project (.tablespec.json)">Open project</button>
      <button class="btn" id="btn-save-spec" title="Save this project as .tablespec.json">Save project</button>
      <span class="topbar-sep"></span>
      <button class="btn btn-primary" id="btn-export" title="Export the table"
              aria-expanded="false">Export ▾</button>
    </div>
  </header>

  <!-- ============ Body: three panes ============ -->
  <div class="workspace">

    <!-- Left rail -->
    <aside class="rail rail-left" id="rail-left">
      <nav class="rail-tabs" id="rail-tabs"></nav>
      <button class="rail-more-toggle" id="rail-more-toggle" type="button">More ▾</button>
      <nav class="rail-tabs rail-tabs-more" id="rail-tabs-more"></nav>
      <div class="rail-body" id="rail-body"></div>
    </aside>

    <!-- Centre: live preview -->
    <main class="stage" id="stage">
      <div class="stage-toolbar">
        <div class="stage-toolbar-group">
          <label class="mini-label" for="zoom-select">Zoom</label>
          <button class="btn btn-mini" id="btn-zoom-out" title="Zoom out (−)">−</button>
          <select class="stage-select zoom-select" id="zoom-select" title="Zoom level (0 for 100%)"></select>
          <button class="btn btn-mini" id="btn-zoom-in" title="Zoom in (+)">+</button>
          <button class="btn btn-mini" id="btn-zoom-fit" title="Fit the whole sheet across the stage. A table too wide to read at this size can be scrolled instead, at any zoom.">Fit</button>
        </div>
        <div class="stage-toolbar-group">
          <label class="mini-label" for="canvas-surface">Canvas</label>
          <select class="stage-select" id="canvas-surface"
                  title="The surface the table sits on. Only visible where the table's own background is transparent — set that under Options › Table › Background.">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="checker">Checkerboard</option>
          </select>
          <label class="switch" title="Spread the canvas across the whole stage instead of a sheet the size of the table. The table then sits directly on it, with no sheet edge.">
            <input type="checkbox" id="toggle-fill">
            <span>Fill stage</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="toggle-select" checked>
            <span>Select mode</span>
          </label>
        </div>
        <div class="stage-toolbar-group stage-selection" id="selection-chip">
          <span class="chip chip-empty">nothing selected</span>
        </div>
      </div>

      <div class="stage-canvas" id="stage-canvas">
        <div class="stage-scroll" id="stage-scroll">
          <!-- The box exists to give the zoomed preview a layout size the stage
               can scroll; App.syncZoomBox writes it. See the CSS. -->
          <div class="zoom-box" id="zoom-box">
            <div class="preview-host" id="preview-host">
              <div class="empty-state" id="empty-state">
                <div class="empty-mark"></div>
                <h2>No data loaded</h2>
                <p>Import a CSV to begin, or load one of the samples.</p>
                <div class="empty-actions">
                  <button class="btn btn-primary" id="btn-import-2">Import CSV</button>
                  <button class="btn" data-sample="data/samples/long.csv">Sample: long / tidy</button>
                  <button class="btn" data-sample="data/samples/wide.csv">Sample: wide</button>
                  <button class="btn" data-sample="data/samples/gtcars.csv">Sample: gtcars</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Right inspector -->
    <aside class="rail rail-right" id="rail-right">
      <div class="rail-head">
        <h3 id="inspector-title">Inspector</h3>
        <span class="rail-head-hint" id="inspector-hint">select something in the table</span>
      </div>
      <div class="rail-body" id="inspector-body"></div>
    </aside>

  </div>

  <!-- ============ Status bar ============ -->
  <footer class="statusbar">
    <span id="status-left">ready</span>
    <span id="status-right"></span>
  </footer>

</div>

<!-- Hidden file inputs -->
<input type="file" id="file-csv" accept=".csv,.tsv,.txt,text/csv" hidden>
<input type="file" id="file-spec" accept=".json,.tablespec.json,application/json" hidden>

<!-- Modal host -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modal-title">Title</h3>
      <button class="btn btn-icon" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Toast host -->
<div class="toast-host" id="toast-host"></div>

<!-- ============ Scripts (classic, explicit load order) ============ -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script src="js/util.js"></script>
<script src="js/options-schema.js"></script>
<script src="js/fonts.js"></script>
<script src="js/markup.js"></script>
<script src="js/palettes.js"></script>
<script src="js/formatters.js"></script>
<script src="js/history.js"></script>
<script src="js/spec.js"></script>
<script src="js/csv.js"></script>
<script src="js/import-html.js"></script>
<script src="js/reshape.js"></script>
<script src="js/corrections.js"></script>
<script src="js/filter.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/style-rules.js"></script>
<script src="js/compute.js"></script>
<script src="js/edges.js"></script>
<script src="js/render-html.js"></script>
<script src="js/measure.js"></script>
<script src="js/render-svg.js"></script>
<script src="js/render-png.js"></script>
<script src="js/export-latex.js"></script>
<script src="js/export-rgt.js"></script>
<script src="js/user-themes.js"></script>
<script src="js/themes.js"></script>

<script src="js/ui/controls.js"></script>
<script src="js/ui/popover.js"></script>
<script src="js/ui/import-preview.js"></script>
<script src="js/ui/theme-picker.js"></script>
<script src="js/ui/font-manager.js"></script>
<script src="js/ui/selection.js"></script>
<script src="js/ui/line-info.js"></script>
<script src="js/ui/inspector.js"></script>
<script src="js/ui/panel-data.js"></script>
<script src="js/ui/panel-steps.js"></script>
<script src="js/ui/panel-structure.js"></script>
<script src="js/ui/panel-content.js"></script>
<script src="js/ui/panel-format.js"></script>
<script src="js/ui/panel-color.js"></script>
<script src="js/ui/panel-style.js"></script>
<script src="js/ui/panel-options.js"></script>
<script src="js/ui/export-menu.js"></script>
<script src="js/ui/history-menu.js"></script>

<script src="js/main.js"></script>

</body>
</html>
